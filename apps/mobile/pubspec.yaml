name: aura_live_mobile
description: "Aura Live Voice Room - Flutter Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  flutter_secure_storage: ^9.2.1
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

