name: Production Build & Blue-Green Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test_and_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test --workspaces

  build_and_deploy:
    needs: test_and_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Container
        run: docker build -t aura-registry.cloud.internal/aura-live-api:${{ github.ref_name }} -f infrastructure/docker/Dockerfile.api .
      - name: Kubernetes Blue/Green Deployment
        run: kubectl apply -f infrastructure/production/helm-values-prod.yaml
