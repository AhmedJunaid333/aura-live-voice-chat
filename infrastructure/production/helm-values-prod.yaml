# Production Helm Configuration Values for Aura Live Voice Room
global:
  environment: production
  domain: auralive.app

replicaCount: 10

resources:
  requests:
    cpu: 1000m
    memory: 1024Mi
  limits:
    cpu: 4000m
    memory: 4096Mi

autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

redis:
  cluster:
    enabled: true
    nodes: 6

database:
  ssl: true
  poolSize: 50
