apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-api-gateway
  namespace: aura-live
  labels:
    app: aura-api
    tier: backend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: aura-api
  template:
    metadata:
      labels:
        app: aura-api
    spec:
      containers:
        - name: aura-api
          image: aura-registry.cloud.internal/aura-live-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 8080
              name: ws
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aura-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aura-api-service
  namespace: aura-live
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
    - port: 8080
      targetPort: 8080
      name: ws
  selector:
    app: aura-api
